<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:fragment="head(t)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6C3FC5">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/css/style.css">
  <title th:text="${t} + ' - Expense Tracker'">Expense Tracker</title>
</head>
<body>
<header class="top" th:fragment="header(title)">
  <h1 th:text="${title}">Title</h1>
</header>
<div th:fragment="flash">
  <div class="toast ok" th:if="${msg}" th:text="${msg}"></div>
  <div class="toast err" th:if="${error}" th:text="${error}"></div>
</div>
<div th:fragment="bottom(active)">
  <div class="overlay" id="overlay"></div>
  <form class="sheet" id="sheet" method="post" th:action="@{/expenses}">
    <div class="grab"></div>
    <h2>Add expense</h2>
    <input type="number" name="amount" step="0.01" min="0.01" placeholder="Amount (Rs.)" required>
    <select name="category"><option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option></select>
    <input type="text" name="description" placeholder="What was it for?">
    <label class="small">When (leave empty for now)</label>
    <input type="datetime-local" name="when">
    <label class="check"><input type="checkbox" name="planned" value="true"> Planned purchase</label>
    <input type="text" name="festivalName" placeholder="Festival name (optional, e.g. Diwali)">
    <button class="btn" type="submit">Save expense</button>
  </form>
  <nav class="bottom">
    <a href="/" th:classappend="${active == 'home'} ? 'on'"><span>🏠</span>Home</a>
    <a href="/insights" th:classappend="${active == 'insights'} ? 'on'"><span>💡</span>Insights</a>
    <button type="button" class="fab" id="fab" aria-label="Add expense">+</button>
    <a href="/goals" th:classappend="${active == 'goals'} ? 'on'"><span>🎯</span>Goals</a>
    <a href="/profile" th:classappend="${active == 'profile'} ? 'on'"><span>👤</span>Profile</a>
  </nav>
  <script src="/js/app.js"></script>
</div>
</body>
</html>
